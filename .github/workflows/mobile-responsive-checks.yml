name: Mobile Responsive & Accessibility Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  responsive-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Typecheck & Production Build
        run: |
          npm run lint
          npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.51.1
          npx playwright install chromium --with-deps

      - name: Run Multi-Viewport & Accessibility Browser Audit
        env:
          PORT: '3000'
          NODE_ENV: 'production'
          BASE_URL: 'http://127.0.0.1:3000'
        run: |
          npx tsx server.ts > /tmp/momentum-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          node tests/responsive-a11y.spec.mjs

      - name: Upload Viewport Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-viewport-screenshots
          path: test-results/screenshots
          if-no-files-found: warn
          retention-days: 14
