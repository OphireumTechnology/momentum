name: Deploy Momentum to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Audit and optimize Pages artifact
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('dist')
          files = [p for p in root.rglob('*') if p.is_file()]
          before = sum(p.stat().st_size for p in files)
          # Only remove exact duplicate, unreferenced copies in the AI Studio
          # staging folder. Never remove canonical documents, branding or images.
          references = b'\n'.join(
              p.read_bytes() for p in files
              if p.suffix.lower() in {'.html', '.js', '.css', '.json', '.svg'}
              and p.stat().st_size < 12_000_000
          )
          by_hash = {}
          for p in files:
              if p.stat().st_size >= 100_000:
                  digest = hashlib.sha256(p.read_bytes()).hexdigest()
                  by_hash.setdefault(digest, []).append(p)
          removed = []
          for group in by_hash.values():
              if len(group) < 2:
                  continue
              for p in group:
                  rel = p.relative_to(root).as_posix()
                  if not rel.startswith('assets/aistudio/'):
                      continue
                  # A basename match is intentionally conservative.
                  if p.name.encode() in references or rel.encode() in references:
                      continue
                  p.unlink()
                  removed.append((rel, p.stat().st_size if p.exists() else 0))
          after = sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          print(f'Pages files: {len(files)}; before: {before/1048576:.1f} MiB; after: {after/1048576:.1f} MiB')
          print('Removed unreferenced AI Studio duplicate paths:', [x[0] for x in removed])
          assert (root/'index.html').is_file(), 'Missing site entry point'
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
